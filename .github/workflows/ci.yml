name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs against recorded fixtures rather than the live API. CI must
  # not depend on a third-party service being reachable, and must not spend the
  # daily credit allowance. A busy afternoon of pushes would exhaust it and
  # start failing builds for reasons unrelated to the code.
  CONTRAIL_SOURCE: replay

jobs:
  ingester:
    name: Go ingester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ingester/go.sum

      - name: Check formatting
        working-directory: ingester
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: ingester
        run: go vet ./...

      - name: Test
        working-directory: ingester
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Report coverage
        working-directory: ingester
        run: go tool cover -func=coverage.out | tail -1

  pipeline:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: pipeline
        run: uv venv && uv pip install -e ".[dev]"

      - name: Lint
        working-directory: pipeline
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check
        working-directory: pipeline
        run: .venv/bin/mypy contrail

      - name: Test
        working-directory: pipeline
        run: .venv/bin/pytest --cov=contrail --cov-report=term-missing

  fixtures:
    name: Fixture measurements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The README quotes duplicate rates and staleness percentiles from this
      # script. Running it in CI means those numbers cannot silently drift away
      # from the fixtures they claim to describe.
      - name: Measure recorded fixtures
        run: python3 scripts/fixture_stats.py fixtures

  end-to-end:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ingester/go.sum

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Start stack
        run: |
          docker compose up -d redpanda clickhouse minio minio-init redpanda-init
          # Compose health checks gate the dependent services, but this job
          # talks to them directly from the runner, so it waits explicitly.
          timeout 120 bash -c 'until curl -sf "http://localhost:8123/ping"; do sleep 2; done'
          timeout 120 bash -c 'until docker exec contrail-redpanda rpk cluster health --brokers localhost:9092 | grep -q "Healthy:.*true"; do sleep 2; done'

      - name: Ingest fixtures into Kafka
        working-directory: ingester
        env:
          CONTRAIL_FIXTURES_DIR: ../fixtures
          CONTRAIL_SINK: kafka
          CONTRAIL_KAFKA_BROKERS: localhost:19092
          CONTRAIL_REPLAY_LOOP: "false"
          CONTRAIL_REPLAY_INTERVAL: 20ms
          CONTRAIL_REGIONS: >-
            [{"name":"benelux","box":{"LatMin":50.0,"LonMin":3.0,"LatMax":53.5,"LonMax":7.5}}]
        run: go run ./cmd/ingester

      - name: Sink into the warehouse
        working-directory: pipeline
        env:
          CONTRAIL_BATCH_SIZE: "2000"
          CONTRAIL_BATCH_TIMEOUT_SECONDS: "5"
        run: |
          uv venv && uv pip install -e .
          .venv/bin/python -m contrail.cli --max-batches 5

      - name: Build and test dbt models
        working-directory: pipeline/transform
        env:
          DBT_PROFILES_DIR: .
        run: |
          cd .. && uv pip install "dbt-core>=1.9" "dbt-clickhouse>=1.8" && cd transform
          ../.venv/bin/dbt deps
          ../.venv/bin/dbt build

      # A green dbt run on an empty warehouse proves nothing: every model
      # would build and every test would pass over zero rows. This asserts the
      # pipeline actually moved data.
      - name: Assert the pipeline produced data
        run: |
          set -euo pipefail
          query() {
            curl -sf "http://localhost:8123/?user=contrail&password=contrail" --data-binary "$1"
          }
          rows=$(query "SELECT count() FROM contrail.bronze_state_vectors")
          flights=$(query "SELECT count() FROM contrail.fct_flights")
          echo "bronze rows: $rows, flights reconstructed: $flights"
          [ "$rows" -gt 1000 ] || { echo "::error::expected >1000 bronze rows, got $rows"; exit 1; }
          [ "$flights" -gt 10 ] || { echo "::error::expected >10 flights, got $flights"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v

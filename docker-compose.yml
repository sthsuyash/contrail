# Contrail local stack.
#
# Everything needed to run the pipeline end to end on one machine. Nothing here
# requires cloud credentials, and the ingester defaults to replay mode so the
# stack produces data without an OpenSky account.

name: contrail

services:
  # ------------------------------------------------------------------ broker
  redpanda:
    image: redpandadata/redpanda:v25.2.5
    container_name: contrail-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      # Two listeners: containers reach the broker as redpanda:9092, while
      # tools on the host use localhost:19092. Kafka clients connect once to
      # discover the cluster and then reconnect to the advertised address, so
      # a single listener would always be wrong for one side or the other.
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # Creates the raw topic explicitly rather than relying on auto-creation.
  #
  # Auto-created topics take broker defaults, which means one partition and
  # whatever retention the cluster happens to have. Partition count cannot be
  # reduced later, and records are keyed by ICAO24 so that ordering per aircraft
  # is preserved. A single partition would serialise all consumers behind one
  # another for no reason. Declaring it here makes those choices reviewable.
  redpanda-init:
    image: redpandadata/redpanda:v25.2.5
    container_name: contrail-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        rpk topic create opensky.states.raw --brokers redpanda:9092
        --partitions 6 --replicas 1
        --topic-config retention.ms=604800000
        --topic-config compression.type=zstd || true;
        rpk topic list --brokers redpanda:9092
    restart: "no"

  console:
    image: redpandadata/console:v3.5.0
    container_name: contrail-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

  # ----------------------------------------------------------------- storage
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: contrail-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: contrail
      CLICKHOUSE_USER: contrail
      CLICKHOUSE_PASSWORD: contrail
      # Without this the bundled user is created with no password and
      # ClickHouse refuses to start under recent images.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./pipeline/clickhouse/init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: contrail-minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: contrail
      MINIO_ROOT_PASSWORD: contrail123
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data

  # Creates the bronze bucket once MinIO is up, then exits. A one-shot job is
  # simpler and more visible than bucket-creation logic inside the sink.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: contrail-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 contrail contrail123 &&
      mc mb --ignore-existing local/contrail-bronze &&
      echo 'bronze bucket ready'
      "
    restart: "no"

  # ---------------------------------------------------------------- ingester
  ingester:
    build:
      context: ./ingester
    container_name: contrail-ingester
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONTRAIL_SOURCE: ${CONTRAIL_SOURCE:-replay}
      CONTRAIL_SINK: kafka
      CONTRAIL_KAFKA_BROKERS: redpanda:9092
      CONTRAIL_KAFKA_TOPIC: opensky.states.raw
      CONTRAIL_FIXTURES_DIR: /fixtures
      CONTRAIL_OPENSKY_CLIENT_ID: ${CONTRAIL_OPENSKY_CLIENT_ID:-}
      CONTRAIL_OPENSKY_CLIENT_SECRET: ${CONTRAIL_OPENSKY_CLIENT_SECRET:-}
      CONTRAIL_QUOTA: ${CONTRAIL_QUOTA:-auto}
    volumes:
      - ./fixtures:/fixtures:ro
    restart: unless-stopped

volumes:
  redpanda-data:
  clickhouse-data:
  minio-data:
